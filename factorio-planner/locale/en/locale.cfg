[mod-name]
factorio-planner=Factory Block Balancer

[mod-description]
factorio-planner=Capture minifactories from the map, balance them exactly, and see how many copies of each your plan needs. Shared live in multiplayer.

[item-name]
fp-selection-tool=Factory capture tool

[item-description]
fp-selection-tool=Drag over machines to capture them as a new factory.

[shortcut-name]
fp-give-tool=Capture factory
fp-toggle-window=Factory Block Balancer

[controls]
fp-toggle-window=Open Factory Block Balancer
fp-give-tool=Capture factory

