fp-rate-unit=Rate unit
fp-edit-permission=Who can edit the plan
fp-max-belt=Highest belt to plan with
fp-one-lane=Plan with one belt lane

[mod-setting-description]
fp-rate-unit=Rates are stored per second and shown in this unit.
fp-edit-permission=Everyone, or admins only. Everyone can always view.
fp-max-belt=Name of a transport belt prototype, e.g. express-transport-belt. Empty: the best belt your force has researched.
fp-one-lane=Check flows against half a belt instead of a full one.

