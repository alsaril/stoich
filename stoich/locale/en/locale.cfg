[mod-name]
stoich=Stoich

[mod-description]
stoich=Capture minifactories from the map, balance them exactly, and see how many copies of each your plan needs. Shared live in multiplayer.

[item-name]
stoich-selection-tool=Factory capture tool

[item-description]
stoich-selection-tool=Drag over machines to capture them as a new factory.

