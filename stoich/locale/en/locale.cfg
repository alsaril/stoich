stoich-one-lane=Plan with one belt lane

[mod-setting-description]
stoich-rate-unit=Rates are stored per second and shown in this unit.
stoich-edit-permission=Everyone, or admins only. Everyone can always view.
stoich-max-belt=Name of a transport belt prototype, e.g. express-transport-belt. Empty: the best belt your force has researched.
stoich-one-lane=Check flows against half a belt instead of a full one.

